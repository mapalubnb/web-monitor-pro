# ============================================================
# web-monitor-pro 业务配置（可选）
# ============================================================
# 任务优先通过飞书命令 /add 添加，无需在本文件预置。
# 这里只保留全局风控配置和默认请求头。

# 种子任务（留空即可；也可在此预置开机自动加载）
tasks: []
# 示例：
# tasks:
#   - name: "产品列表"
#     url: "https://example.com/products"
#     strategy: "scrapling_static"
#     selector: ".product-list"
#     adaptive_selector: true
#     selector_identifier: "product-list"
#     adaptive_threshold: 40
#     interval: 300

# ============================================================
# 全局风控配置
# ============================================================
risk_control:
  domain_min_interval: 10                # 单域名最小请求间隔（秒）
  jitter_ratio: 0.3                      # 请求抖动比例（0.3 = ±30%）
  alert_after_consecutive_failures: 3    # 连续失败 N 次才告警
  min_change_ratio: 0.005                # 变化占比低于此值视为噪音
  push_cooldown_seconds: 30              # 同任务推送冷却
  backoff_ladder: [60, 300, 900, 3600]   # 失败退避阶梯

# ============================================================
# 默认请求头（所有抓取共用）
# ============================================================
default_headers:
  Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
  Accept-Language: "en-US,en;q=0.9,zh-CN;q=0.8,zh;q=0.7"
