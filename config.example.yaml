# ============================================================
# web-monitor-pro 任务配置（可选，也可通过飞书 /add 命令添加）
# ============================================================
# 本文件里定义的任务会在启动时自动加载（若数据库中不存在）
# 运行时通过飞书命令新增/修改的任务以数据库为准

tasks:
  # ---------- 示例 1：静态 HTML 页面（L1-L2 级）----------
  - name: "示例-GitHub Trending"
    url: "https://github.com/trending"
    type: html                   # html / json / auto
    strategy: auto               # auto / httpx / curl_cffi / jina / firecrawl
    selector: "article.Box-row"  # CSS 选择器，只监控匹配的区域（可选）
    interval: 300                # 检查间隔（秒）
    keywords: []                 # 关键字过滤（命中才推送；空数组 = 任何变化都推）
    enabled: false               # 示例默认关闭

  # ---------- 示例 2：SPA / Cloudflare 保护的网页（L3-L4 级）----------
  - name: "示例-four.meme 创建页"
    url: "https://four.meme/en/create-token"
    type: html
    strategy: curl_cffi          # 强制使用 TLS 指纹伪装
    impersonate: chrome131       # 模拟的浏览器：chrome131 / chrome124 / firefox133 / safari18_0
    extract_next_data: true      # 提取 __NEXT_DATA__ 中的 JSON 数据（Next.js 站点常用）
    interval: 120
    enabled: false

  # ---------- 示例 3：内部 API 直取（最优，L4 级）----------
  - name: "示例-某 API 监控"
    url: "https://example.com/api/v1/items?page=1"
    type: json
    json_path: "data[*].name,data[*].price"   # 仅提取感兴趣的字段路径
    headers:
      Referer: "https://example.com/"
    interval: 60
    enabled: false

# ============================================================
# 全局风控配置
# ============================================================
risk_control:
  # 单域名最小间隔（秒）
  domain_min_interval: 10
  # 请求间抖动比例（0.3 = ±30%）
  jitter_ratio: 0.3
  # 连续失败 N 次才告警，避免单次网络抖动刷屏
  alert_after_consecutive_failures: 3
  # diff 变化比例低于此值则视为噪音丢弃（例：0.005 = 0.5%）
  min_change_ratio: 0.005
  # 同任务推送冷却（秒）
  push_cooldown_seconds: 30
  # 失败退避阶梯（秒）
  backoff_ladder: [60, 300, 900, 3600]

# ============================================================
# 请求头模板（所有抓取共用）
# ============================================================
default_headers:
  Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
  Accept-Language: "en-US,en;q=0.9,zh-CN;q=0.8,zh;q=0.7"
