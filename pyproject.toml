[project]
name = "web-monitor-pro"
version = "0.1.0"
description = "高风控友好的网页变化监控服务，集成飞书交互机器人"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
